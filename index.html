<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <title>Cuenta Clara</title>
    <meta name="description" content="Control de gastos e ingresos — por Juan Carlos Calderón" />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1D63D1" />

    <!-- Android / Chrome install -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />

    <!-- iOS Safari "Add to Home Screen" support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cuenta Clara" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!--
  Pega/reemplaza esto dentro del <head> de tu index.html actual.
  Los archivos icon-*.png, favicon.ico y manifest.json van en /public
  (ya los tienes en public/icons/, public/favicon.ico y public/manifest.json).
-->

<link rel="icon" type="image/x-icon" href="/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#1D63D1" />

<!-- iOS: para que al "Añadir a pantalla de inicio" se vea como app -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Cuenta Clara" />

  </head>
  <body style="margin:0;background:#F1F6FC;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
